<script>/* theme before first paint (design system, ui.js) */(function(){try{var p=localStorage.getItem("tmsc.theme")||"auto";var d=p==="dark"||(p==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");document.documentElement.setAttribute("data-lang",localStorage.getItem("tmsc.lang")||"en");}catch(e){}})();</script>

<script>
// Files dropped anywhere on the page never open in the browser; they go to the Upload page (admin).
window.__bootErrors = [];
window.addEventListener('error', function (e) { window.__bootErrors.push((e.message || 'Script error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
(function () {
  function isFiles(e) { var t = e.dataTransfer && e.dataTransfer.types; if (!t) return false; for (var i = 0; i !== t.length; i++) if (t[i] === 'Files' || t[i] === 'application/x-moz-file') return true; return false; }
  function stop(e) { if (!isFiles(e)) return; e.preventDefault(); try { e.dataTransfer.dropEffect = window.TMSC_DROP ? 'copy' : 'none'; } catch (x) {} }
  window.addEventListener('dragenter', stop, true); window.addEventListener('dragover', stop, true);
  window.addEventListener('drop', function (e) { if (!isFiles(e)) return; e.preventDefault(); e.stopPropagation(); if (window.TMSC_DROP) window.TMSC_DROP(e.dataTransfer); }, true);
})();
</script>
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="icons/logo.png" alt=""><span class="bt"><span class="pname">SSE/P.Way Performance Report</span><span class="org">एसएसई/रेल पथ कार्य-निष्पादन रिपोर्ट · Howrah Division</span></span></div>
  <div class="actions">
    <div id="uiTools" class="row" style="gap:6px;flex-wrap:nowrap"></div>
    <div class="who hidden" id="who"><span class="rolechip" id="whoRole"></span><b id="whoName"></b><span id="whoScope"></span></div>

    <button class="tb small" id="btnHelp">Help</button>
  </div>
</header>

  </aside>
  <main id="main">

</div>

<div id="tip" class="tip hidden"></div>
<script src="config.js?v=202610271701"></script>
<script>/* [E] 22-Oct: a phone / PC that opened the app before may still hold old files (the saved copy of the service worker). This page is
   always fresh from the network; if the program files that came with it are of another build, clear the saved copy and load once more. */
(function(){ var V='202610271701', got=(window.TMSC_CONFIG||{}).VERSION||''; if (!/^\d{12}$/.test(V) || got===V) return;
  var k='tmsc.heal.'+V; try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); } catch(e) {}
  var done=function(){ location.reload(); };
  try { Promise.all([ (navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }) : Promise.resolve()),
    (window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(x){ return caches.delete(x); })); }) : Promise.resolve()) ]).then(done, done); } catch(e) { done(); }
  document.write('<div style="font:15px system-ui;padding:24px">Updating to the latest version…</div>'); window.__TMSC_HEALING = true;
})();</script>
